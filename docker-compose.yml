services:
  api:
    image: my-api:latest
    restart: always
    env_file: .env
    networks:
      - web-net

  frontend:
    image: my-frontend:latest
    restart: always
    networks:
      - web-net

  oauth:
    image: my-oauth:latest
    restart: always
    networks:
      - web-net

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web-net
    depends_on:
      - api
      - frontend
      - oauth

networks:
  web-net: